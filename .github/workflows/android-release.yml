name: Android Release (AAB)

# Builds and signs the IslandHop Android App Bundle (.aab) from the Capacitor
# project in ./frontend. Trigger it manually (Actions tab → Run workflow) or by
# pushing a version tag like v1.1.0.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-aab:
    runs-on: ubuntu-latest
    # Signing uses ONLY these repo secrets (no committed keystore, no defaults):
    #   ANDROID_KEYSTORE_BASE64   base64 of the Play *upload* keystore (base64 -w0 upload.jks)
    #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
    # The upload cert SHA1 must be 25:6B:33:E7:BA:90:6B:C6:68:66:2B:D5:A4:0A:5C:F7:C6:15:0F:3C
    # (verify with: keytool -list -v -keystore upload.jks).
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_UPLOAD_SHA1: '25:6B:33:E7:BA:90:6B:C6:68:66:2B:D5:A4:0A:5C:F7:C6:15:0F:3C'
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: yarn install --frozen-lockfile

      - name: Build web app
        run: yarn build
        env:
          GENERATE_SOURCEMAP: 'false'
          CI: 'false'
          # Production backend the Play Store app must talk to.
          # Override by setting a repo Variable named REACT_APP_BACKEND_URL.
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL || 'https://islandhopapp.com' }}

      - name: Sync web build into Android (Capacitor)
        run: npx cap sync android

      - name: Verify signing secrets are set
        run: |
          missing=0
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required repository secret $v. Provide the Play upload keystore via secrets."
              missing=1
            fi
          done
          exit $missing

      - name: Decode signing keystore and verify fingerprint
        run: |
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/upload.jks
          test -s android/keystore/upload.jks || { echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file"; exit 1; }
          actual=$(keytool -list -v -keystore android/keystore/upload.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -m1 'SHA1:' | sed 's/.*SHA1: *//')
          if [ "$actual" != "$EXPECTED_UPLOAD_SHA1" ]; then
            echo "::error::Keystore SHA1 ($actual) does not match the Play upload key ($EXPECTED_UPLOAD_SHA1)"
            exit 1
          fi

      - name: Write keystore.properties
        run: |
          {
            echo "storeFile=../keystore/upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build signed release AAB
        working-directory: frontend/android
        env:
          # Auto-incrementing versionCode: offset keeps it above the current live
          # value (2) and always ascending as run_number grows.
          VERSION_CODE: ${{ github.run_number + 100 }}
        run: |
          chmod +x gradlew
          echo "Building versionCode=$VERSION_CODE"
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" app/build.gradle
          ./gradlew clean bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: islandhop-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------
      # Auto-publish to Google Play (internal track).
      # Opt-in & safe: only runs when you set a repo VARIABLE named
      #   ENABLE_PLAY_PUBLISH = true
      # and a repo SECRET named PLAY_SERVICE_ACCOUNT_JSON (Play API service-account key).
      # Prerequisite: the app must already exist in Play Console AND have had one
      # AAB uploaded manually at least once (Play requires the very first upload
      # to be manual). The .aab artifact above is uploaded regardless, so a
      # publish misconfig never costs you the build output.
      # ---------------------------------------------------------------------
      - name: Publish to Google Play (internal)
        if: ${{ vars.ENABLE_PLAY_PUBLISH == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.islandhop.app
          releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
