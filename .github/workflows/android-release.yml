name: Android Release (AAB)

# Builds and signs the IslandHop Android App Bundle (.aab) from the Capacitor
# project in ./frontend. Trigger it manually (Actions tab → Run workflow) or by
# pushing a version tag like v1.1.0.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: yarn install --frozen-lockfile

      - name: Build web app
        run: yarn build
        env:
          GENERATE_SOURCEMAP: 'false'
          CI: 'false'

      - name: Sync web build into Android (Capacitor)
        run: npx cap sync android

      - name: Decode signing keystore
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystore/islandhop-upload.jks
          echo "Keystore written ($(stat -c%s android/keystore/islandhop-upload.jks) bytes)"

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=../keystore/islandhop-upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed release AAB
        working-directory: frontend/android
        env:
          # Auto-incrementing versionCode: offset keeps it above the current live
          # value (2) and always ascending as run_number grows.
          VERSION_CODE: ${{ github.run_number + 100 }}
        run: |
          chmod +x gradlew
          echo "Building versionCode=$VERSION_CODE"
          ./gradlew clean bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: islandhop-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------
      # OPTIONAL: auto-publish to Google Play (internal track).
      # Requires a Play service-account JSON stored as the PLAY_SERVICE_ACCOUNT_JSON
      # secret, and the app already created + first APK/AAB uploaded manually once.
      # Uncomment to enable.
      # ---------------------------------------------------------------------
      # - name: Publish to Google Play (internal)
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.islandhop.app
      #     releaseFiles: frontend/android/app/build/outputs/bundle/release/app-release.aab
      #     track: internal
      #     status: completed
