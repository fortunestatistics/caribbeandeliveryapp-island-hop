name: Build Signed Android AAB

# Builds a Play-ready, signed .aab on a cloud x86 runner.
# Download it from the run's "Artifacts" section (no Android Studio needed).

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

jobs:
  build-aab:
    runs-on: ubuntu-latest   # x86_64 — so Android's aapt2 runs natively
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: yarn install --frozen-lockfile

      - name: Build web app
        env:
          CI: false   # don't fail the build on lint warnings
          # Production backend the released app will talk to.
          # Override by setting a repo variable named REACT_APP_BACKEND_URL.
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL || 'https://islandhopapp.com' }}
        run: yarn build

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode signing keystore (optional override — only if a secret is set)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/islandhop-upload.jks

      - name: Verify keystore is present
        run: test -s android/keystore/islandhop-upload.jks || (echo "::error::Signing keystore missing" && exit 1)

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=../keystore/islandhop-upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'islandhop2026' }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS || 'islandhop' }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD || 'islandhop2026' }}
          EOF

      - name: Build signed release bundle
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: islandhop-release-aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
