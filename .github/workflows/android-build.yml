name: Build Signed Android AAB

# Builds a Play-ready, signed .aab on a cloud x86 runner.
# Download it from the run's "Artifacts" section (no Android Studio needed).

on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

jobs:
  build-aab:
    runs-on: ubuntu-latest   # x86_64 — so Android's aapt2 runs natively
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::Missing secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::Missing secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::Missing secret ANDROID_KEY_PASSWORD"; exit 1; }

          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/islandhop-upload.jks

          cat > android/keystore.properties <<EOF
          storeFile=../keystore/islandhop-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        run: corepack enable && yarn install --frozen-lockfile

      - name: Build web app
        env:
          CI: false   # don't fail the build on lint warnings
          # Production backend the released app will talk to.
          # Override by setting a repo variable named REACT_APP_BACKEND_URL.
          REACT_APP_BACKEND_URL: ${{ vars.REACT_APP_BACKEND_URL || 'https://islandhopapp.com' }}
        run: corepack enable && yarn build

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools build-tools;35.0.0'

      - name: Remove stale aapt2 override
        run: |
          if [ -f "$HOME/.gradle/gradle.properties" ]; then
            sed -i '/android\.aapt2FromMavenOverride/d' "$HOME/.gradle/gradle.properties"
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build AAB
        working-directory: frontend/android
        run: ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
