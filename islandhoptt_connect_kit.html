<!-- ─────────────────────────────────────────────────────────────────────────

     ───────────────────────────────────────────────────────────────────────── -->
<form id="ih-driver-form" onsubmit="ihSubmitDriver(event)"

  <h3 style="margin:0">Drive with IslandHop</h3>
  <input name="full_name" placeholder="Full name" required style="padding:10px;border:1px solid #ccc;border-radius:8px">
  <input name="email" type="email" placeholder="Email" required style="padding:10px;border:1px solid #ccc;border-radius:8px">
  <input name="phone" placeholder="Phone (+1868...)" required style="padding:10px;border:1px solid #ccc;border-radius:8px">

<!-- ─────────────────────────────────────────────────────────────────────────
     5) ONE SHARED SCRIPT  — paste once (handles both forms above)
     ───────────────────────────────────────────────────────────────────────── -->
<script>
  const IH_API = "https://islandhopapp.com/api";
  const IH_API_KEY = "ihtt_pub_GU4x1SizzZCs3sDkf1YJ12mWnM700Eb96HwX2Wx824c"; // optional extra security

  async function ihPost(path, form, msgEl) {
    msgEl.textContent = "Submitting…"; msgEl.style.color = "#475569";
    const data = Object.fromEntries(new FormData(form).entries());
    try {
      const res = await fetch(IH_API + path, {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-API-Key": IH_API_KEY },
        body: JSON.stringify(data),
      });
      const j = await res.json();
      if (res.ok && j.success) {
        msgEl.textContent = "✅ " + (j.message || "Application received!");
        msgEl.style.color = "#16a34a"; form.reset();
      } else {
        msgEl.textContent = "⚠️ " + (j.detail || "Something went wrong. Please try again.");
        msgEl.style.color = "#dc2626";
      }
    } catch (e) {
      msgEl.textContent = "⚠️ Network error. Please try again."; msgEl.style.color = "#dc2626";
    }
  }
  function ihSubmitDriver(e){ e.preventDefault(); ihPost("/public/applications/driver", e.target, document.getElementById("ih-driver-msg")); }
  function ihSubmitMerchant(e){ e.preventDefault(); ihPost("/public/applications/merchant", e.target, document.getElementById("ih-merchant-msg")); }
</script>
