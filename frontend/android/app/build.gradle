apply plugin: 'com.android.application'

// Release signing: env vars > Gradle properties (-P / ~/.gradle/gradle.properties) > git-ignored keystore.properties.
// Never commit passwords.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def signingValue = { String envName, String propName, String fileKey ->
    System.getenv(envName) ?: (project.findProperty(propName) ?: keystoreProperties[fileKey])
}
def releaseStoreFile = signingValue('ISLANDHOP_STORE_FILE', 'ISLANDHOP_STORE_FILE', 'storeFile')
def releaseStorePassword = signingValue('ISLANDHOP_STORE_PASSWORD', 'ISLANDHOP_STORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signingValue('ISLANDHOP_KEY_ALIAS', 'ISLANDHOP_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('ISLANDHOP_KEY_PASSWORD', 'ISLANDHOP_KEY_PASSWORD', 'keyPassword')
def hasSigningConfig = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.islandhop.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.islandhop.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode: CI passes VERSION_CODE (auto-incrementing). Local builds
        // fall back to baseVersionCode below — bump it only if building by hand.
        versionCode (System.getenv('VERSION_CODE') ? System.getenv('VERSION_CODE').toInteger() : 2)
        versionName (System.getenv('VERSION_NAME') ?: "1.1")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasSigningConfig) {
                // Relative paths resolve against the app/ module directory.
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Never fall back to the debug key; release tasks fail below if signing is missing.
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Fail fast instead of producing a debug-signed or unsigned bundle Play would reject.
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find {
        it.project == project && it.name in ['bundleRelease', 'assembleRelease', 'packageReleaseBundle']
    }
    if (releaseTask && !hasSigningConfig) {
        throw new GradleException("Release signing is not configured. Set ISLANDHOP_STORE_FILE, " +
            "ISLANDHOP_STORE_PASSWORD, ISLANDHOP_KEY_ALIAS and ISLANDHOP_KEY_PASSWORD (env vars or Gradle " +
            "properties), or create android/keystore.properties from keystore.properties.example.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
